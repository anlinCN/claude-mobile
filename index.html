<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1EA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Claude Chat</title>
<style>
:root { --bg:#F5F1EA; --card:#FFFDF8; --text:#2B2A27; --accent:#CC785C; --muted:#8A847A; --line:#E6DFD3; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
body { display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); background:var(--bg); }
header .title { font-weight:600; flex:1; }
select, button, input, textarea { font:inherit; }
select { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 8px; color:var(--text); }
button.ghost { border:none; background:none; color:var(--muted); padding:6px; cursor:pointer; }
#log { flex:1; overflow-y:auto; padding:16px 12px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:86%; padding:10px 14px; border-radius:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
.bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
.err { align-self:center; color:#B04A3A; font-size:14px; }
form { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--bg); }
textarea { flex:1; resize:none; max-height:140px; border:1px solid var(--line); border-radius:12px; padding:10px; background:var(--card); color:var(--text); outline:none; }
#send { background:var(--accent); color:#fff; border:none; border-radius:12px; padding:0 16px; cursor:pointer; }
#send:disabled { opacity:.5; }
#dialog { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; padding:20px; }
#dialog .box { background:var(--card); border-radius:14px; padding:20px; width:100%; max-width:360px; }
#dialog input { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; margin:10px 0; }
#dialog .row { display:flex; gap:8px; justify-content:flex-end; }
#dialog .row button { padding:8px 14px; border-radius:8px; border:none; cursor:pointer; }
</style>
</head>
<body>
<header>
  <span class="title">Claude Chat</span>
  <select id="model">
    <option value="claude-sonnet-5-5" selected>Sonnet 5.5</option>
    <option value="claude-opus-5-5">Opus 5.5</option>
    <option value="claude-haiku-5-5">Haiku 5.5</option>
  </select>
  <button class="ghost" id="newChat" title="新对话">＋</button>
  <button class="ghost" id="setKey" title="设置 API Key">⚙</button>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
  <button id="send" type="submit">发送</button>
</form>
<div id="dialog">
  <div class="box">
    <div><strong>API Key</strong></div>
    <input id="keyInput" type="password" placeholder="sk-ant-...">
    <div style="font-size:13px;color:var(--muted)">只保存在本机浏览器中，不会上传到其他地方。</div>
    <div class="row"><button id="keyCancel" style="background:#eee">取消</button><button id="keySave" style="background:var(--accent);color:#fff">保存</button></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let history = JSON.parse(localStorage.getItem('chat_history') || '[]');
let busy = false;

function save() { localStorage.setItem('chat_history', JSON.stringify(history)); }

function addBubble(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

function renderAll() {
  $('log').innerHTML = '';
  history.forEach(m => addBubble(m.role === 'user' ? 'user' : 'bot', m.content));
}

async function send(text) {
  const key = localStorage.getItem('anthropic_key');
  if (!key) { openKey(); return; }
  history.push({ role: 'user', content: text });
  addBubble('user', text);
  const bubble = addBubble('bot', '…');
  busy = true; $('send').disabled = true;
  let answer = '';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: $('model').value, max_tokens: 4096, stream: true, messages: history })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    bubble.textContent = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'content_block_delta' && ev.delta.type === 'text_delta') {
          answer += ev.delta.text;
          bubble.textContent = answer;
          $('log').scrollTop = $('log').scrollHeight;
        }
      }
    }
    history.push({ role: 'assistant', content: answer });
    save();
  } catch (e) {
    history.pop();
    bubble.remove();
    const d = document.createElement('div');
    d.className = 'err';
    d.textContent = '出错：' + e.message;
    $('log').appendChild(d);
  } finally {
    busy = false; $('send').disabled = false;
  }
}

function openKey() {
  $('keyInput').value = localStorage.getItem('anthropic_key') || '';
  $('dialog').style.display = 'flex';
}

$('setKey').onclick = openKey;
$('keyCancel').onclick = () => $('dialog').style.display = 'none';
$('keySave').onclick = () => {
  localStorage.setItem('anthropic_key', $('keyInput').value.trim());
  $('dialog').style.display = 'none';
};
$('newChat').onclick = () => { if (!busy) { history = []; save(); renderAll(); } };

$('form').onsubmit = e => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text || busy) return;
  $('input').value = '';
  send(text);
};

renderAll();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
