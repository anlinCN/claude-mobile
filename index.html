<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Claude</title>
<style>
:root { --bg:#FAF9F6; --side:#F3F2EE; --text:#1F1E1D; --muted:#86847C; --user:#F0EEE6; --card:#FFFFFF; --accent:#D97757; --line:#E8E6DC; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
body { display:flex; flex-direction:column; overflow:hidden; }
.serif { font-family:"Songti SC","SimSun","Noto Serif SC",Georgia,serif; }
button, select, textarea { font:inherit; }
.icon-btn { background:none; border:none; color:var(--text); width:40px; height:40px; border-radius:10px; font-size:22px; display:flex; align-items:center; justify-content:center; }
header { display:flex; align-items:center; justify-content:space-between; height:56px; padding:8px 10px; flex-shrink:0; }
#log { flex:1; overflow-y:auto; padding:8px 18px 16px; display:flex; flex-direction:column; gap:22px; }
#empty { flex:1; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
#empty.show { display:flex; }
#empty h2 { font-weight:400; font-size:26px; margin:0; }
.user { align-self:flex-end; max-width:80%; background:var(--user); padding:12px 16px; border-radius:18px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.bot { font-family:"Songti SC","SimSun","Noto Serif SC",Georgia,serif; font-size:17px; line-height:1.75; white-space:pre-wrap; word-break:break-word; }
.bot .foot { font-family:-apple-system,"PingFang SC",sans-serif; font-size:12px; color:var(--muted); margin-top:12px; display:flex; flex-direction:column; gap:6px; }
.bot .copy { align-self:flex-start; background:none; border:none; color:var(--muted); font-size:13px; padding:2px 0; }
.err { align-self:center; color:#B04A3A; font-size:14px; }
footer { padding:8px 12px calc(12px + env(safe-area-inset-bottom)); flex-shrink:0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:14px 14px 10px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
#input { width:100%; border:none; outline:none; resize:none; background:transparent; font-size:16px; color:var(--text); min-height:24px; max-height:160px; }
.row { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
#model { background:var(--side); border:none; border-radius:999px; padding:7px 12px; font-size:14px; color:var(--text); outline:none; }
#send { width:36px; height:36px; border-radius:50%; border:none; background:var(--text); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; }
#send:disabled { opacity:.35; }
#side { position:fixed; top:0; bottom:0; left:0; width:78%; max-width:300px; background:var(--side); transform:translateX(-100%); transition:transform .25s; display:flex; flex-direction:column; padding:20px 14px calc(20px + env(safe-area-inset-bottom)); z-index:20; }
#side.open { transform:none; }
#mask { position:fixed; inset:0; background:rgba(0,0,0,.2); display:none; z-index:15; }
#mask.show { display:block; }
.nav { background:none; border:none; text-align:left; padding:12px 10px; border-radius:10px; font-size:16px; color:var(--text); }
.nav:active { background:#E9E7E0; }
.side-foot { margin-top:auto; display:flex; align-items:center; gap:10px; }
.avatar { width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; }
#dialog { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; padding:20px; z-index:30; }
#dialog .box { background:var(--card); border-radius:16px; padding:20px; width:100%; max-width:360px; }
#dialog input { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; margin:10px 0; }
#dialog .row { justify-content:flex-end; gap:8px; margin-top:12px; }
#dialog .row button { padding:8px 14px; border-radius:8px; border:none; cursor:pointer; }
</style>
</head>
<body>
<div id="mask"></div>
<aside id="side">
  <div class="serif" style="font-size:24px;margin:6px 10px 18px">Claude</div>
  <button class="nav" id="navNew">＋ 新建对话</button>
  <button class="nav" id="navKey">⚙ API Key</button>
  <div class="side-foot"><div class="avatar">我</div></div>
</aside>
<header>
  <button class="icon-btn" id="menu" aria-label="菜单">☰</button>
  <button class="icon-btn" id="newChat" aria-label="新对话">✎</button>
</header>
<main id="empty">
  <svg width="56" height="56" viewBox="-28 -28 56 56" stroke="#D97757" stroke-width="4.5" stroke-linecap="round" fill="none">
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(30)"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(60)"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(90)"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(120)"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(150)"/>
  </svg>
  <h2 class="serif">今天想聊点什么？</h2>
</main>
<div id="log"></div>
<footer>
  <form id="form">
    <div class="card">
      <textarea id="input" rows="1" placeholder="回复 Claude…"></textarea>
      <div class="row">
        <select id="model">
          <option value="claude-sonnet-5-5" selected>Sonnet 5.5</option>
          <option value="claude-opus-5-5">Opus 5.5</option>
          <option value="claude-haiku-5-5">Haiku 5.5</option>
        </select>
        <button id="send" type="submit" aria-label="发送">↑</button>
      </div>
    </div>
  </form>
</footer>
<div id="dialog">
  <div class="box">
    <div><strong>API Key</strong></div>
    <input id="keyInput" type="password" placeholder="sk-ant-...">
    <div style="font-size:13px;color:var(--muted)">只保存在本机浏览器中，不会上传到其他地方。</div>
    <div class="row"><button id="keyCancel" style="background:#eee">取消</button><button id="keySave" style="background:var(--text);color:#fff">保存</button></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let history = JSON.parse(localStorage.getItem('chat_history') || '[]');
let busy = false;
const save = () => localStorage.setItem('chat_history', JSON.stringify(history));

function userEl(text) {
  const d = document.createElement('div');
  d.className = 'user';
  d.textContent = text;
  return d;
}

function botEl(text, final) {
  const d = document.createElement('div');
  d.className = 'bot';
  d.textContent = text;
  if (final) addFoot(d, text);
  return d;
}

function addFoot(d, text) {
  const foot = document.createElement('div');
  foot.className = 'foot';
  const copy = document.createElement('button');
  copy.className = 'copy';
  copy.textContent = '复制';
  copy.onclick = () => navigator.clipboard.writeText(text);
  const note = document.createElement('div');
  note.textContent = 'Claude 是 AI，可能会出错。';
  foot.append(copy, note);
  d.appendChild(foot);
}

function renderAll() {
  $('log').innerHTML = '';
  history.forEach(m => $('log').appendChild(m.role === 'user' ? userEl(m.content) : botEl(m.content, true)));
  $('empty').classList.toggle('show', history.length === 0);
}

function scrollDown() { $('log').scrollTop = $('log').scrollHeight; }

async function send(text) {
  const key = localStorage.getItem('anthropic_key');
  if (!key) { openKey(); return; }
  $('empty').classList.remove('show');
  history.push({ role: 'user', content: text });
  $('log').appendChild(userEl(text));
  const bot = botEl('…', false);
  $('log').appendChild(bot);
  busy = true; $('send').disabled = true;
  let answer = '';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: $('model').value, max_tokens: 4096, stream: true, messages: history })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    bot.textContent = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'content_block_delta' && ev.delta.type === 'text_delta') {
          answer += ev.delta.text;
          bot.textContent = answer;
          scrollDown();
        }
      }
    }
    history.push({ role: 'assistant', content: answer });
    save();
    bot.textContent = answer;
    addFoot(bot, answer);
  } catch (e) {
    history.pop();
    bot.remove();
    const d = document.createElement('div');
    d.className = 'err';
    d.textContent = '出错：' + e.message;
    $('log').appendChild(d);
  } finally {
    busy = false; $('send').disabled = false;
    scrollDown();
  }
}

function openKey() {
  $('keyInput').value = localStorage.getItem('anthropic_key') || '';
  $('dialog').style.display = 'flex';
  closeSide();
}
function openSide() { $('side').classList.add('open'); $('mask').classList.add('show'); }
function closeSide() { $('side').classList.remove('open'); $('mask').classList.remove('show'); }

$('menu').onclick = openSide;
$('mask').onclick = closeSide;
$('navKey').onclick = openKey;
$('navNew').onclick = () => { if (!busy) { history = []; save(); renderAll(); closeSide(); } };
$('newChat').onclick = () => { if (!busy) { history = []; save(); renderAll(); } };
$('keyCancel').onclick = () => $('dialog').style.display = 'none';
$('keySave').onclick = () => {
  localStorage.setItem('anthropic_key', $('keyInput').value.trim());
  $('dialog').style.display = 'none';
};
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
});
$('form').onsubmit = e => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text || busy) return;
  $('input').value = '';
  send(text);
};

renderAll();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
